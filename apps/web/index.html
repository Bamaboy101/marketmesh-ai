<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarketMesh AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .candle-up { color: #10b981; }
      .candle-down { color: #ef4444; }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script type="module">
      import React from 'https://esm.sh/react@18.2.0'
      import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client'

      const API_BASE = 'https://marketmesh-api.marketmesh-api.workers.dev'

      async function fetchApi(path, opts = {}) {
        const res = await fetch(`${API_BASE}${path}`, { ...opts, headers: { 'Content-Type': 'application/json', ...opts.headers } })
        if (!res.ok) throw new Error(`API ${path}: ${res.status}`)
        return res.json()
      }

      // Components
      function AssetRow({ asset, onSelect }) {
        const selected = useSelected()
        return (
          <tr
            onClick={() => onSelect(asset)}
            className={`cursor-pointer px-4 py-3 border-b hover:bg-gray-50 ${selected.id === asset.id ? 'bg-blue-50 border-blue-200' : ''}`}
          >
            <td className="font-medium">{asset.name}</td>
            <td className="text-sm text-gray-500">{asset.asset_class}</td>
            <td className="text-sm text-gray-500">{asset.venue}</td>
            <td className="font-mono text-sm">{asset.demo ? 'demo' : 'live'}</td>
          </tr>
        )
      }

      let selectedAssetId = null
      function useSelected() { return { id: selectedAssetId } }

      function CandleChart({ candles }) {
        if (!candles || candles.length === 0) return <div className="h-64 flex items-center justify-center text-gray-400">No data</div>
        const closes = candles.map(c => c.close)
        const max = Math.max(...closes)
        const min = Math.min(...closes)
        const range = max - min || 1
        const h = 300
        return (
          <div className="h-64 w-full border rounded-lg p-4 relative overflow-hidden bg-white shadow-sm">
            <svg className="w-full h-full" viewBox={`0 0 ${candles.length * 12} ${h}`}>
              {candles.map((c, i) => {
                const y = h - ((c.close - min) / range) * (h - 40)
                const prev = candles[i - 1]
                const prevY = prev ? h - ((prev.close - min) / range) * (h - 40) : y
                const color = c.close >= (prev ? prev.close : c.open) ? '#10b981' : '#ef4444'
                return (
                  <g key={i}>
                    <line x1={i * 12 + 4} y1={prevY} x2={i * 12 + 8} y2={y} stroke={color} strokeWidth={2} strokeLinecap="round" />
                    <circle cx={i * 12 + 6} cy={y} r={2.5} fill={color} />
                    <text x={i * 12 + 6} y={h - 5} fontSize="10" textAnchor="middle" fill="#9ca3af">{c.start_utc.slice(5, 16)}</text>
                  </g>
                )
              })}
              <defs>
                <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#10b981" stopOpacity="0.2" />
                  <stop offset="100%" stopColor="#10b981" stopOpacity="0" />
                </linearGradient>
              </defs>
            </svg>
            <div className="mt-2 text-xs text-gray-500">Price range: ${min.toLocaleString()} - ${max.toLocaleString()}</div>
          </div>
        )
      }

      function SignalCard({ signal }) {
        const fired = signal.fired
        return (
          <div className={`p-4 rounded-lg border ${fired ? 'border-green-200 bg-green-50' : 'border-gray-200 bg-gray-50`} `}
          >
            <div className="flex justify-between items-start">
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="font-medium text-gray-900">{signal.rule_id}</span>
                  <span className={`text-xs px-2 py-0.5 rounded-full ${fired ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500`} `}>
                    {fired ? 'FIRED' : 'NEUTRAL'}
                  </span>
                </div>
                <div className="text-sm text-gray-600">{signal.asset_id} • v{signal.rule_version}</div>
                <div className="mt-2 text-gray-900">{signal.evidence}</div>
                <div className="mt-2 text-xs text-gray-500">RSI: {signal.trigger_values?.rsi?.toFixed?.(2) ?? 'N/A'}</div>
                <div className="text-xs text-gray-400 mt-1">{new Date(signal.fired_utc).toLocaleString()}</div>
              </div>
              <button
                onClick={() => fetchApi('/api/alerts/preview', { method: 'POST', body: JSON.stringify({ signal_id: signal.id || signal.inputs_hash, channel: 'preview' }) }).then(() => alert('Alert preview created'))}
                className="px-3 py-1.5 text-sm border rounded hover:bg-gray-100 transition"
              >
                Preview Alert
              </button>
            </div>
          </div>
        )
      }

      function App() {
        const [assets, setAssets] = React.useState([])
        const [candles, setCandles] = React.useState([])
        const [signals, setSignals] = React.useState([])
        const [selected, setSelected] = React.useState(null)
        const [loading, setLoading] = React.useState(false)

        React.useEffect(() => {
          fetchApi('/api/assets').then(setAssets).catch(() => setAssets([
            { id: 'BTCUSDT', symbol: 'BTCUSDT', name: 'Bitcoin / Tether', asset_class: 'crypto', venue: 'demo', demo: true },
            { id: 'ETHUSDT', symbol: 'ETHUSDT', name: 'Ethereum / Tether', asset_class: 'crypto', venue: 'demo', demo: true },
            { id: 'XAUUSD', symbol: 'XAUUSD', name: 'Gold / US Dollar', asset_class: 'commodity', venue: 'demo', demo: true },
            { id: 'AAPL', symbol: 'AAPL', name: 'Apple Inc', asset_class: 'stock', venue: 'demo', demo: true },
          ]))
        }, [])

        const loadCandles = async (assetId) => {
          setLoading(true)
          try {
            const data = await fetchApi(`/api/candles?asset=${assetId}&limit=30`)
            setCandles(data)
          } catch (e) { console.error(e) }
          setLoading(false)
        }

        const evaluateSignal = async () => {
          if (!selected) return
          try {
            const signal = await fetchApi('/api/signals/evaluate', {
              method: 'POST',
              body: JSON.stringify({ asset_id: selected.id, rule_id: 'rsi14', limit: 30 })
            })
            setSignals(prev => [...prev.filter(s => s.rule_id !== 'rsi14' || s.asset_id !== selected.id), signal])
          } catch (e) { console.error(e) }
        }

        return (
          <div className="min-h-screen">
            <nav className="bg-white border-b shadow-sm">
              <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">M</div>
                  <span className="font-bold text-xl text-gray-800">MarketMesh AI</span>
                </div>
                <div className="flex items-center gap-4 text-sm text-gray-600">
                  <span className="flex items-center gap-1"><span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Live</span>
                  <span>Demo data • No exchange account</span>
                </div>
              </div>
            </nav>

            <div className="max-w-7xl mx-auto px-4 py-6">
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                {/* Watchlist */}
                <div className="lg:col-span-1">
                  <div className="bg-white rounded-lg shadow-sm border p-4">
                    <h2 className="font-bold mb-4">Watchlist</h2>
                    <table className="w-full text-sm">
                      <tbody>
                        {assets.map(a => (
                          <AssetRow key={a.id} asset={a} onSelect={setSelected} />
                        ))}
                      </tbody>
                    </table>
                    <div className="mt-4 text-xs text-gray-500">Select an asset to view candles and signals</div>
                  </div>
                </div>

                {/* Chart */}
                <div className="lg:col-span-2">
                  <div className="bg-white rounded-lg shadow-sm border p-4">
                    <div className="flex justify-between items-center mb-4">
                      <h2 className="font-bold">{selected?.name || 'Select an asset'}</h2>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => { if (selected) loadCandles(selected.id) }}
                          disabled={loading || !selected}
                          className="px-3 py-1.5 text-sm border rounded hover:bg-gray-50 disabled:opacity-50"
                        >
                          {loading ? 'Loading...' : 'Refresh'}
                        </button>
                        <button
                          onClick={evaluateSignal}
                          disabled={loading || !selected}
                          className="px-3 py-1.5 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50"
                        >
                          Evaluate Signal
                        </button>
                      </div>
                    </div>
                    {loading ? <div className="h-64 flex items-center justify-center text-gray-400">Loading candles...</div> : (
                      <CandleChart candles={candles} />
                    )}
                  </div>
                </div>

                {/* Signals */}
                <div className="lg:col-span-1">
                  <div className="bg-white rounded-lg shadow-sm border p-4">
                    <h2 className="font-bold mb-4">Signal History</h2>
                    <div className="space-y-3">
                      {signals.length > 0 ? signals.map(s => <SignalCard key={s.inputs_hash + s.rule_id} signal={s} />) : (
                        <div className="text-center py-8 text-gray-400 text-sm">No signals yet. Select an asset and evaluate.</div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
